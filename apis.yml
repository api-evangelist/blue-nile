name: Blue Nile
description: 'Blue Nile is an online retailer of diamonds and fine jewelry, founded
  in 1999 and headquartered in Seattle, Washington. It pioneered the direct-to-consumer
  model for engagement rings and loose diamonds, letting shoppers search and compare
  certified diamonds by cut, color, clarity, and carat and build custom rings, wedding
  bands, and gifts online. The company is now part of Signet Jewelers. Blue Nile is
  included in the API Evangelist network as a consumer / e-commerce company profile;
  it was originally surfaced as a portfolio company of Bessemer Venture Partners,
  Lightspeed Venture Partners, and Trinity Ventures. No public developer API, OpenAPI
  specification, or SDK surface was found during enrichment.'
